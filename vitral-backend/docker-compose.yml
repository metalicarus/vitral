services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vitral
      POSTGRES_USER: vitral
      POSTGRES_PASSWORD: ${VITRAL_DB_PASSWORD:?Defina VITRAL_DB_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitral -d vitral"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      VITRAL_DB_URL: jdbc:postgresql://postgres:5432/vitral
      VITRAL_DB_USER: vitral
      VITRAL_DB_PASSWORD: ${VITRAL_DB_PASSWORD:?Defina VITRAL_DB_PASSWORD no arquivo .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
