quarkus.application.name=vitral

# --- Data directory ---------------------------------------------------------
# Everything Vitral stores lives here: the database (vitral.db), the photo
# library (library/) and temporary uploads (tmp/). Created on first start.
vitral.data-dir=${VITRAL_DATA_DIR:data}
# Each test run gets a brand-new data directory: quarkus.uuid is random on every start.
# (Flyway 12's clean does not drop anything on SQLite, so an existing database can't be reset.)
%test.vitral.data-dir=target/test-data/${quarkus.uuid}

# --- Database (SQLite) -----------------------------------------------------
quarkus.datasource.db-kind=other
# The SQLite driver, extended to create the data directory before the first connection.
quarkus.datasource.jdbc.driver=com.genosha.vitral.config.SqliteDriver
quarkus.datasource.jdbc.url=jdbc:sqlite:${vitral.data-dir}/vitral.db
quarkus.datasource.jdbc.max-size=8
# WAL lets readers work while a write is in progress.
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL
# SQLite does not enforce foreign keys unless asked to.
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
# Transactions take the write lock when they begin (BEGIN IMMEDIATE), so
# concurrent writers wait in line (up to busy_timeout ms) instead of failing.
quarkus.datasource.jdbc.additional-jdbc-properties.transaction_mode=IMMEDIATE
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# The schema is owned by Flyway (src/main/resources/db/migration).
quarkus.flyway.migrate-at-start=true

# --- Uploads ----------------------------------------------------------------
# Largest file accepted in one request.
vitral.upload.max-size=4G
quarkus.http.limits.max-body-size=${vitral.upload.max-size}
# Temporary upload files stay on the same disk as the library, so moving them
# into place is an instant rename instead of a copy.
quarkus.http.body.uploads-directory=${vitral.data-dir}/tmp/uploads
quarkus.http.body.delete-uploaded-files-on-end=true

# Time zone for photos without one in their EXIF, and for the year/month folders
# of photos dated by file or upload time. Defaults to the system time zone.
# vitral.time-zone=America/Sao_Paulo
%test.vitral.time-zone=America/Sao_Paulo

# --- Thumbnails --------------------------------------------------------------
# Folder with the libvips tools (vipsthumbnail, vipsheader); by default they are
# looked up on the PATH.
# vitral.media.vips-dir=/opt/vips/bin
# How many photos have their thumbnails generated at the same time.
vitral.media.workers=2

# --- API docs ---------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Vitral API
quarkus.smallrye-openapi.info-version=0.1.0

# --- Vitral -----------------------------------------------------------------
vitral.session.ttl=P90D
vitral.login.max-failures=5
vitral.login.lockout=PT15M