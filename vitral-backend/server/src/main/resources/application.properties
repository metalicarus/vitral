quarkus.application.name=vitral

# --- Logs ---------------------------------------------------------------------
# Vitral's own messages: INFO records every meaningful event (logins, uploads, scans,
# trash, albums, administration); DEBUG adds details such as each thumbnail generated.
# Passwords and session tokens are never logged.
quarkus.log.category."com.genosha.vitral".level=${VITRAL_LOG_LEVEL:INFO}
# The user behind a request (%X{user}) appears on every line logged while handling it.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] (%t) %X{user} %s%e%n
# Logs also go to <data-dir>/logs/vitral.log, rotated at 10 MB, keeping the last 10 files.
quarkus.log.file.enabled=true
quarkus.log.file.path=${vitral.data-dir}/logs/vitral.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] (%t) %X{user} %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.rotate-on-boot=false
# Every HTTP request: client address, request line, status, response size and time taken.
# Turn off with QUARKUS_HTTP_ACCESS_LOG_ENABLED=false.
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b %D ms
# Needed for the time taken (%D).
quarkus.http.record-request-start-time=true
# Flyway prints an empty history table at startup; only its migration summary is useful.
quarkus.log.category."org.flywaydb".level=WARN
quarkus.log.category."org.flywaydb.core.internal.command.DbMigrate".level=INFO
quarkus.http.access-log.exclude-pattern=/q/health.*
# Tests keep their output short.
%test.quarkus.log.file.enabled=false
# Logging is set up before quarkus.uuid (part of the test data folder) exists.
%test.quarkus.log.file.path=target/test.log
%test.quarkus.http.access-log.enabled=false

# --- Data directory ---------------------------------------------------------
# Everything Vitral stores lives here: the database (vitral.db), the photo
# library (library/) and temporary uploads (tmp/). Created on first start.
vitral.data-dir=${VITRAL_DATA_DIR:data}
# Each test run gets a brand-new data directory: quarkus.uuid is random on every start.
# (Flyway 12's clean does not drop anything on SQLite, so an existing database can't be reset.)
%test.vitral.data-dir=target/test-data/${quarkus.uuid}

# --- Database (SQLite) -----------------------------------------------------
quarkus.datasource.db-kind=other
# The SQLite driver, extended to create the data directory before the first connection.
quarkus.datasource.jdbc.driver=com.genosha.vitral.config.SqliteDriver
quarkus.datasource.jdbc.url=jdbc:sqlite:${vitral.data-dir}/vitral.db
quarkus.datasource.jdbc.max-size=8
# WAL lets readers work while a write is in progress.
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL
# SQLite does not enforce foreign keys unless asked to.
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
# Transactions take the write lock when they begin (BEGIN IMMEDIATE), so
# concurrent writers wait in line (up to busy_timeout ms) instead of failing.
quarkus.datasource.jdbc.additional-jdbc-properties.transaction_mode=IMMEDIATE
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# The schema is owned by Flyway (src/main/resources/db/migration).
quarkus.flyway.migrate-at-start=true

# --- Uploads ----------------------------------------------------------------
# Largest file accepted in one request.
vitral.upload.max-size=4G
quarkus.http.limits.max-body-size=${vitral.upload.max-size}
# Temporary upload files stay on the same disk as the library, so moving them
# into place is an instant rename instead of a copy.
quarkus.http.body.uploads-directory=${vitral.data-dir}/tmp/uploads
quarkus.http.body.delete-uploaded-files-on-end=true

# Time zone for photos without one in their EXIF, and for the year/month folders
# of photos dated by file or upload time. Defaults to the system time zone.
# vitral.time-zone=America/Sao_Paulo
%test.vitral.time-zone=America/Sao_Paulo

# --- Thumbnails --------------------------------------------------------------
# Folder with the libvips tools (vipsthumbnail, vipsheader); by default they are
# looked up on the PATH.
# vitral.media.vips-dir=/opt/vips/bin
# How many photos have their thumbnails generated at the same time.
vitral.media.workers=2

# --- Trash ---------------------------------------------------------------------
# How long a photo stays in the trash, where it can be restored, before it is deleted for
# good. Uploaded originals are deleted then; files in watched folders are never touched.
vitral.trash.retention=P30D

# --- Database backups -------------------------------------------------------------
# A consistent copy of the catalog (vitral.db) goes to <data-dir>/backups once a day, keeping
# the last 7. The photos themselves are not in it: back up the library folder separately.
vitral.backup.enabled=true
vitral.backup.interval=P1D
vitral.backup.keep=7
%test.vitral.backup.enabled=false

# --- Watched folders -----------------------------------------------------------
# Folders are added by an administrator through /api/v1/admin/folders. Changes are noticed
# as they happen; on top of that, every folder is scanned in full this often.
vitral.import.scan-interval=PT15M
# A file must stay untouched this long before it is cataloged, so files still being
# written by a sync tool are not read half-way.
vitral.import.settle=PT5S
%test.vitral.import.settle=PT1S

# --- API docs ---------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Vitral API
quarkus.smallrye-openapi.info-version=0.1.0

# --- Vitral -----------------------------------------------------------------
vitral.session.ttl=P90D
vitral.login.max-failures=5
vitral.login.lockout=PT15M