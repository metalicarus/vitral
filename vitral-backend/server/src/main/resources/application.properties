quarkus.application.name=vitral

# --- Database ---------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# In dev and test mode, Quarkus Dev Services starts this PostgreSQL image
# automatically (Docker required). pgvector is included for the future AI phase.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
# In production, the connection comes from environment variables.
%prod.quarkus.datasource.jdbc.url=${VITRAL_DB_URL:jdbc:postgresql://localhost:5432/vitral}
%prod.quarkus.datasource.username=${VITRAL_DB_USER:vitral}
%prod.quarkus.datasource.password=${VITRAL_DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration).
quarkus.flyway.migrate-at-start=true

# --- API docs ---------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Vitral API
quarkus.smallrye-openapi.info-version=0.1.0

# --- Vitral -----------------------------------------------------------------
vitral.session.ttl=P90D
vitral.login.max-failures=5
vitral.login.lockout=PT15M
