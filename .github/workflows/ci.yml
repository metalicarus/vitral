# Runs the tests of the server and of the desktop client on every push to main and on
# every pull request, so a change that breaks something shows up on the PR before the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Servidor
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vitral-backend/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: vitral-backend/server/pom.xml

      # libvips generates the thumbnails; without it the thumbnail tests are skipped
      # instead of run. The libde265 plugin lets it read HEIC.
      - name: Instalar o libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools libheif-plugin-libde265

      - name: Testes
        run: mvn -B test

      - name: Guardar os relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-servidor
          path: vitral-backend/server/target/surefire-reports/

  # Builds the server's Docker image, without publishing it, so a change that breaks
  # "docker compose up" shows up before the merge.
  docker:
    name: Imagem Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: vitral-backend
          file: vitral-backend/docker/Dockerfile
          push: false
          # Reuses the Maven dependency layer between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  client:
    name: Client desktop
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vitral-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: vitral-client/pom.xml

      # The tests never open a window, so they run without a display.
      - name: Testes
        run: mvn -B test

      - name: Guardar os relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-client
          path: vitral-client/target/surefire-reports/
